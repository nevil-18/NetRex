<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guardian settings</title>
    <style>
      :root {
        font-family: "Segoe UI", system-ui, sans-serif;
        color: #0f1c1a;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(165deg, #f5f8f6, #dfe9e3);
      }
      main {
        width: min(480px, calc(100% - 32px));
        background: rgba(255, 255, 255, 0.8);
        border: 1px solid #c5d4cc;
        border-radius: 18px;
        padding: 28px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: -0.03em;
      }
      p {
        color: #3d524c;
        line-height: 1.5;
      }
      label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        padding: 12px;
        border-radius: 10px;
        border: 1px solid #c5d4cc;
        font-family: ui-monospace, monospace;
      }
      button {
        margin-top: 14px;
        border: 0;
        border-radius: 10px;
        background: #0f1c1a;
        color: white;
        padding: 10px 16px;
        font-weight: 700;
        cursor: pointer;
      }
      #msg {
        margin-top: 10px;
        font-size: 13px;
        color: #1f7a5c;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Guardian API</h1>
      <p>
        Point the extension at your local Guardian WebAPI. Default is
        <code>http://127.0.0.1:8741</code>.
      </p>
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="url" placeholder="http://127.0.0.1:8741" />
      <button id="save" type="button">Save</button>
      <div id="msg"></div>
    </main>
    <script type="module" src="options.js"></script>
  </body>
</html>
